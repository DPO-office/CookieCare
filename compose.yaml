name: lora

x-lora-app: &lora-app
  image: lora:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      LORA_DOMAIN: ${LORA_DOMAIN:?Set LORA_DOMAIN to the public DNS name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *lora-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      SKIP_DB: "false"
      DATABASE_URL: ${DATABASE_URL:?Set the internal db connection URL in .env}
      DOCLING_SERVICE_URL: ${DOCLING_SERVICE_URL:?Set the authenticated HTTPS Docling service URL}
      DOCLING_SERVICE_TOKEN: ${DOCLING_SERVICE_TOKEN:?Set DOCLING_SERVICE_TOKEN}
      ANALYSIS_LOG: "0"
      ANALYSIS_DUMP_COMPLIANCE_BUNDLES: "0"
      ANALYSIS_DUMP_COMPLIANCE_PRE_REPORT: "0"
      ANALYSIS_DUMP_COMPLIANCE_VERIFICATION: "0"
    ports:
      - "127.0.0.1:${LORA_HTTP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/healthz').then(r => r.json()).then(body => process.exit(body.status === 'ok' ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  db-setup:
    <<: *lora-app
    profiles: ["setup"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SKIP_DB: "false"
      DATABASE_URL: ${DATABASE_URL:?Set the internal db connection URL in .env}
    command: ["node", "backend/dist/db-setup.js"]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
